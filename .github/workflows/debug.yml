name: Debug排障

on:
  #push:
  #  branches: [main]
  # pull_request:
  # 手动触发：事件链路异常时用它区分配置问题与账号级限制
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行测试
        run: node tests/run.js

      # 构建校验会拦截 JSON 中的脏数据，与测试互补
      - name: 校验数据与构建
        run: node build.js
